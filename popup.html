<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="popup.css">
    <title>HopTab</title>
</head>
<body>
    <i id="addBtn" class="fa-solid fa-circle-plus">ADD</i>
    <div class="addCard" hidden>
        <div class="card">
            <input id="url" type="url" placeholder="Enter URL..."><br>
            <input id="name" type="text" placeholder="Enter title...">
            <i id="exeAdd" class="fa-solid fa-circle-plus">GO</i>
            <i id="close-1" class="fa-solid fa-circle-xmark" style="color: red;">Close</i>
        </div>
    </div>
    <i id="delBtn" class="fa-solid fa-circle-minus">DEL</i>
    <div class="delCard" hidden>
        <label>
            <input type="checkbox" id="selectAll">
            Select All
        </label>
        <hr>
        <div id="deletelist"></div>
        <i id="exeDel" class="fa-solid fa-circle-plus">GO</i>
        <i id="close-2" class="fa-solid fa-circle-xmark" style="color: red;">Close</i>
    </div>
    <div class="wrapper">
        <div class="heading">
            <p>HopTab</p>
            <p></p>
            <p id="time"></p>
        </div>
        <hr>
        <div class="main">
        </div>

    </div>
    <script src="popup.js"></script>
</body>
</html>
